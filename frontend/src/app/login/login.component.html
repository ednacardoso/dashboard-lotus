<div class="login-container">
  <div class="login-card">
    <h1>{{ isRegistering() ? 'Criar conta' : 'Entrar' }}</h1>
    <p class="subtitle">Dashboard</p>

    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }

    @if (!isRegistering()) {
      <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input id="login-email" type="email" formControlName="email" placeholder="admin@example.com" />
        </div>

        <div class="form-group">
          <label for="login-password">Senha</label>
          <input id="login-password" type="password" formControlName="password" placeholder="••••••" />
        </div>

        <button type="submit" [disabled]="isLoading() || loginForm.invalid">
          {{ isLoading() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    } @else {
      <form [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()">
        <div class="form-group">
          <label for="register-name">Nome</label>
          <input id="register-name" type="text" formControlName="name" placeholder="Seu nome" />
        </div>

        <div class="form-group">
          <label for="register-email">E-mail</label>
          <input id="register-email" type="email" formControlName="email" placeholder="seu@email.com" />
        </div>

        <div class="form-group">
          <label for="register-password">Senha</label>
          <input id="register-password" type="password" formControlName="password" placeholder="Mínimo 6 caracteres" />
        </div>

        <button type="submit" [disabled]="isLoading() || registerForm.invalid">
          {{ isLoading() ? 'Criando...' : 'Criar conta' }}
        </button>
      </form>
    }

    <p class="toggle">
      {{ isRegistering() ? 'Já tem uma conta?' : 'Ainda não tem conta?' }}
      <button type="button" class="link" (click)="toggleMode()">
        {{ isRegistering() ? 'Entrar' : 'Criar conta' }}
      </button>
    </p>

    <p class="hint">Use <strong>admin@example.com</strong> / <strong>admin123</strong></p>
  </div>
</div>
